name: CI - API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import check
        run: python -c "import app.main"
